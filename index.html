<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="在浏览器本地完成 200px PNG 图标预审。" />
    <title>百宝箱图标预审</title>
    <link rel="manifest" href="manifest.webmanifest?v=5" />
    <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro" id="intro" aria-labelledby="page-title">
        <h1 id="page-title">百宝箱图标预审</h1>
        <p>需下载原始文件，才能准确判断文件大小。</p>
      </section>

      <section class="drop-zone" id="drop-zone" aria-labelledby="drop-title">
        <div class="drop-visual" aria-hidden="true">
          <span class="corner corner-tl"></span>
          <span class="corner corner-tr"></span>
          <span class="corner corner-bl"></span>
          <span class="corner corner-br"></span>
          <span class="paste-mark">⌘V</span>
        </div>
        <div class="drop-copy">
          <h2 id="drop-title">等待图标</h2>
          <p id="drop-hint">复制图片后，点击下方按钮读取剪贴板</p>
        </div>
        <label class="file-button primary-button" for="file-input">选择原始 PNG</label>
        <input id="file-input" type="file" accept="image/*,.png,.jpg,.jpeg,.webp" hidden />
        <button class="paste-button" id="paste-button" type="button">粘贴并预审</button>
        <button class="share-tool-button" id="share-tool-button" type="button">分享这个工具</button>
        <p class="compatibility-note">若浏览器不支持读取剪贴板，请长按此区域粘贴，或选择原始文件。</p>
      </section>

      <section class="result-panel" id="result-panel" hidden aria-live="polite">
        <div class="result-heading">
          <h2 id="result-title">正在检测</h2>
          <button class="text-button" id="replace-button" type="button">更换图标</button>
        </div>

        <div class="preview-panel">
          <div class="preview-toolbar" role="group" aria-label="预览背景">
            <button class="preview-option is-active" type="button" data-preview="grid">透明</button>
            <button class="preview-option" type="button" data-preview="light">浅色</button>
            <button class="preview-option" type="button" data-preview="dark">深色</button>
          </div>
          <div class="preview-stage preview-grid" id="preview-stage">
            <canvas id="preview-canvas" width="200" height="200" aria-label="待审核图标预览"></canvas>
            <div class="safe-area" aria-hidden="true"></div>
          </div>
          <p class="preview-caption" id="file-caption"></p>
        </div>

        <div class="summary" id="summary">
          <span class="summary-mark" id="summary-mark" aria-hidden="true"></span>
          <div>
            <strong id="summary-title">检测中</strong>
            <p id="summary-copy">正在读取图像像素。</p>
          </div>
        </div>

        <div class="check-list" id="check-list"></div>

        <details class="rules">
          <summary>查看审核标准</summary>
          <div class="rules-grid">
            <span>画布</span><strong>200 × 200 px</strong>
            <span>制图区</span><strong>190 × 190 px</strong>
            <span>文件</span><strong>PNG，最大 15 KB</strong>
          </div>
        </details>
      </section>

      <p class="footer-note">粘贴可检查图像规范。文件大小请使用下载后的原始 PNG 核验。</p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js?v=5"></script>
  </body>
</html>
